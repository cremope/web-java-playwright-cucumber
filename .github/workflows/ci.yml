name: Run Playwright Tests and Publish Allure Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Install Playwright Browsers
        run: mvn playwright:install-browsers

      - name: Run tests
        run: mvn clean test -Dheadless=true
        continue-on-error: true

      - name: Checkout previous gh-pages branch (Allure history)
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        if: always()
        run: |
          mkdir -p target/allure-results

          # Copia o histórico para manter o gráfico de Trend
          if [ -d "gh-pages/history" ]; then
            cp -r gh-pages/history target/allure-results/
          fi

          mvn allure:report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/allure-report